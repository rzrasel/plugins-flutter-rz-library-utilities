name: rz_library_utilities
description: A powerful Flutter utility library for clean architecture - validators, extensions, mappers, JSON helpers, session handling and common reusable widgets.
version: 1.0.0
repository: https://github.com/rzrasel/plugins-flutter-rz-library-utilities
homepage: https://github.com/rzrasel/plugins-flutter-rz-library-utilities

publish_to: none

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  #
  # get: ^4.7.3
  # cached_network_image: ^3.4.1
  # shimmer: ^3.0.0
  # lottie: ^3.3.3
  intl: ^0.20.3
  dns_client: ^1.3.1
  #
  #rz_theme_set_1:
    #git:
      #url: https://github.com/rzrasel/flutter-plugins-rz-theme-set-1.git
      #ref: vref-1.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  plugin:
    platforms:
      android:
        package: com.rzrasel.rz_library_utilities
        pluginClass: RzLibraryUtilitiesPlugin
      ios:
        pluginClass: RzLibraryUtilitiesPlugin
      linux:
        pluginClass: RzLibraryUtilitiesPlugin
      macos:
        pluginClass: RzLibraryUtilitiesPlugin
      windows:
        pluginClass: RzLibraryUtilitiesPluginCApi
      web:
        pluginClass: RzLibraryUtilitiesWeb
        fileName: rz_library_utilities_web.dart

